<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Onde ficam os componentes de um modelo local no perfil testado</title>
  <desc id="desc">Os pesos dos experts ficam principalmente na RAM e são processados pela CPU. A GPU de 3 GB mantém parte compartilhada do modelo e o cache KV de oito bits, que cresce com o contexto. Setas mostram a troca de dados.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b40"/><stop offset="1" stop-color="#192651"/></linearGradient>
    <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff9479"/><stop offset="1" stop-color="#e872aa"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#79bdff"/><stop offset="1" stop-color="#a69bff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec7f8"/></marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #eff4ff; }
      .sub { fill: #becdeb; font-size: 18px; }
      .head { font-size: 28px; font-weight: 700; }
      .tag { fill: #cfdcff; font-size: 16px; letter-spacing: 1.2px; font-weight: 700; }
      .line { fill: none; stroke: #aec7f8; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="560" rx="30" fill="url(#bg)"/>
  <text x="64" y="67" class="tag">PERFIL Q4 TESTADO · GPU DE 3 GB</text>
  <text x="64" y="108" class="head">Dividir o trabalho para caber na memória</text>

  <rect x="62" y="172" width="326" height="268" rx="24" fill="#24345f" stroke="#6f82bc" stroke-width="2"/>
  <text x="90" y="214" class="tag">RAM</text>
  <text x="90" y="250" font-size="23" font-weight="700">Pesos dos experts</text>
  <text x="90" y="279" class="sub">Grande parte do arquivo GGUF</text>
  <g fill="url(#blue)">
    <rect x="92" y="318" width="48" height="48" rx="8"/><rect x="151" y="318" width="48" height="48" rx="8"/><rect x="210" y="318" width="48" height="48" rx="8"/>
    <rect x="92" y="376" width="48" height="48" rx="8"/><rect x="151" y="376" width="48" height="48" rx="8"/><rect x="210" y="376" width="48" height="48" rx="8"/>
  </g>

  <path class="line" d="M393 310H470"/>
  <rect x="479" y="206" width="249" height="199" rx="24" fill="#2b365e" stroke="#e497aa" stroke-width="2"/>
  <text x="511" y="246" class="tag">CPU</text>
  <text x="511" y="284" font-size="23" font-weight="700">Calcula os experts</text>
  <text x="511" y="315" class="sub">Ativos a cada token</text>
  <g fill="url(#pink)"><rect x="516" y="340" width="38" height="38" rx="6"/><rect x="564" y="340" width="38" height="38" rx="6"/><rect x="612" y="340" width="38" height="38" rx="6"/></g>

  <path class="line" d="M733 310H812"/>
  <rect x="821" y="172" width="396" height="268" rx="24" fill="#263565" stroke="#8ba8f5" stroke-width="2"/>
  <text x="853" y="214" class="tag">GPU · 3 GB DE VRAM</text>
  <text x="853" y="249" font-size="21" font-weight="700">Pesos compartilhados + cache KV</text>
  <text x="853" y="279" class="sub">No teste, cache compactado em q8_0</text>
  <g fill="url(#pink)"><rect x="856" y="318" width="48" height="48" rx="8"/><rect x="916" y="318" width="48" height="48" rx="8"/></g>
  <g fill="#a8aaff" opacity=".85"><rect x="991" y="321" width="178" height="12" rx="5"/><rect x="991" y="343" width="178" height="12" rx="5"/><rect x="991" y="365" width="178" height="12" rx="5"/></g>
  <text x="856" y="409" class="sub">O cache cresce com a janela de contexto</text>

  <path d="M112 482H1169" stroke="#566b9e" stroke-width="2"/>
  <text x="64" y="518" font-size="19" fill="#d6e2ff">Se o conjunto ultrapassa a VRAM livre, a geração pode cair muito de velocidade.</text>
</svg>
