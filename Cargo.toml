[package]
name = "summanus"
version = "3.0.0"
edition = "2021"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
pulldown-cmark = "0.12"
rfd = "0.15"
shell-words = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
regex = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
latex-rust = { version = "=1.0.2", default-features = false, features = ["std", "png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
